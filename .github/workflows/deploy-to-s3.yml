name: Deploy Addressables to S3

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to publish from the latest main commit
        required: true
        type: choice
        options: [development]

permissions:
  contents: read

jobs:
  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.changed.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed environment folders
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          REQUESTED_ENV: ${{ inputs.environment }}
        run: python3 .github/scripts/addressables.py detect

  deploy:
    needs: detect
    if: needs.detect.outputs.envs != '[]'
    strategy:
      matrix:
        env: ${{ fromJson(needs.detect.outputs.envs) }}
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ matrix.env }}
    concurrency:
      group: addressables-deploy-${{ matrix.env }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve main after acquiring the environment's concurrency slot.
          # A delayed/retried run must not restore an older catalog.
          ref: main
          persist-credentials: false

      - name: Check environment still exists on main
        id: source
        env:
          ENV_NAME: ${{ matrix.env }}
        run: |
          set -euo pipefail
          if [ -d "$ENV_NAME" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Publishing commit $(git rev-parse HEAD)"
          else
            echo "Skipping environment removed from main: $ENV_NAME"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate folder and configuration
        if: steps.source.outputs.exists == 'true'
        env:
          ENV_NAME: ${{ matrix.env }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          S3_PREFIX: ${{ vars.S3_PREFIX || 'addressables' }}
        run: python3 .github/scripts/addressables.py validate

      - name: Show OIDC trust diagnostics
        if: steps.source.outputs.exists == 'true'
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          parts = urllib.parse.urlsplit(url)
          query = urllib.parse.parse_qs(parts.query)
          query["audience"] = ["sts.amazonaws.com"]
          url = urllib.parse.urlunsplit(parts._replace(
              query=urllib.parse.urlencode(query, doseq=True)))
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["value"]
          # Decode only for diagnostics. AWS validates the token during authentication.
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print("AWS_ROLE_ARN=" + os.environ["AWS_ROLE_ARN"])
          # Never print the token, request credential, or full claims payload.
          print(json.dumps({key: claims.get(key) for key in
                            ("sub", "aud", "ref", "environment")}, indent=2))
          PY

      - name: Authenticate to AWS via OIDC
        if: steps.source.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: addressables-${{ matrix.env }}-${{ github.run_id }}

      - name: Check the content version follows the published one
        if: steps.source.outputs.exists == 'true'
        env:
          ENV_NAME: ${{ matrix.env }}
          # The public address the game reads content from. Read here instead of S3, so the deploy
          # role needs no read access to the bucket (S3 reads answered 403 and stopped every publish).
          CONTENT_URL: ${{ vars.CONTENT_URL || 'https://drjkqjn56t2kc.cloudfront.net/addressables' }}
        run: |
          set -euo pipefail
          base="${CONTENT_URL%/}"
          published="$RUNNER_TEMP/published"
          mkdir -p "$published"
          # Downloads one published file. 404, or 403 from the CDN for a file it does not have, counts
          # as absent; any other failure stops the publish rather than being read as "nothing published".
          fetch() {
            local status
            status=$(curl -sS -o "$2" -w '%{http_code}' -H 'Cache-Control: no-cache' --retry 3 --retry-all-errors "$1?ts=$(date +%s)") || {
              echo "::error::Could not read $1"
              exit 1
            }
            case "$status" in
              200) return 0 ;;
              403|404) rm -f "$2"; return 1 ;;
              *) echo "::error::Could not read $1: HTTP $status"; exit 1 ;;
            esac
          }
          export PUBLISHED_VERSION_FILE="" PUBLISHED_HASH_FILE=""
          # No version.json published yet means nothing versioned is published: the first must be 0.
          # A version.json that cannot be read also lands here, and is refused for any version but 0.
          if fetch "$base/version.json" "$published/version.json"; then
            export PUBLISHED_VERSION_FILE="$published/version.json"
            # The published release's catalogue hash, beside version.json.
            hash_name=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8-sig")); print(d["catalog"].rsplit(".", 1)[0] + ".hash")' "$PUBLISHED_VERSION_FILE")
            if fetch "$base/$hash_name" "$published/catalog.hash"; then
              export PUBLISHED_HASH_FILE="$published/catalog.hash"
            fi
          fi
          python3 .github/scripts/addressables.py check-version

      - name: Publish bundles, then catalogues, then hashes
        if: steps.source.outputs.exists == 'true'
        env:
          ENV_NAME: ${{ matrix.env }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX || 'addressables' }}
        run: |
          set -euo pipefail
          dest="s3://${S3_BUCKET}/${S3_PREFIX}/"
          aws s3 sync "$ENV_NAME/" "$dest" --exclude '*' --include '*.bundle' --no-follow-symlinks --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          # Always copy mutable metadata, including nested platform catalogs.
          aws s3 cp "$ENV_NAME/" "$dest" --recursive --exclude '*' --include 'catalog*.bin' --include 'catalog*.json' --include '*/catalog*.bin' --include '*/catalog*.json' --no-follow-symlinks --cache-control 'public,max-age=60' --only-show-errors
          aws s3 cp "$ENV_NAME/" "$dest" --recursive --exclude '*' --include 'catalog*.hash' --include '*/catalog*.hash' --no-follow-symlinks --cache-control 'public,max-age=60' --only-show-errors

      - name: Publish version.json last
        if: steps.source.outputs.exists == 'true'
        env:
          ENV_NAME: ${{ matrix.env }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX || 'addressables' }}
        run: |
          set -euo pipefail
          # Last, so a game that reads the new number can already fetch everything it points at.
          # no-cache: the game must see a new release as soon as it is published.
          aws s3 cp "$ENV_NAME/version.json" "s3://${S3_BUCKET}/${S3_PREFIX}/version.json" --no-follow-symlinks --cache-control 'no-cache' --content-type 'application/json' --only-show-errors
